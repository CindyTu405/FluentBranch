services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chat_db
    restart: always
    environment:
      TZ: Asia/Taipei
      POSTGRES_INITDB_ARGS: "--timezone=Asia/Taipei"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: chat_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    container_name: chat_api
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app # 本機開發用熱重載
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - SQL_ECHO=${SQL_ECHO:-false}
      - DAILY_MESSAGE_LIMIT=${DAILY_MESSAGE_LIMIT:-10}
      - ALLOWED_MODELS=${ALLOWED_MODELS:-gemini*}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-}
      - SITE_DAILY_MESSAGE_LIMIT=${SITE_DAILY_MESSAGE_LIMIT:-900}
      - GUEST_IP_DAILY_GUESTS=${GUEST_IP_DAILY_GUESTS:-10}
      - GUEST_IP_DAILY_MESSAGES=${GUEST_IP_DAILY_MESSAGES:-100}
      - GUEST_RETENTION_DAYS=${GUEST_RETENTION_DAYS:-7}
      - IP_HASH_SECRET=${IP_HASH_SECRET:-}
      # 不設預設值，只放本機 .env，絕不進版控
      - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY:-}
      - MAX_OUTPUT_TOKENS=${MAX_OUTPUT_TOKENS:-3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      # 容器內連資料庫須用 service name 'db'，不能用 localhost
    depends_on:
      - db

volumes:
  postgres_data: