# 不用任何 secret，harness 用假模型與假登入
name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          # harness 需要 g2_tmp：openrouter_connect 只允許 g2_tmp，guest 拒絕 chat_db
          POSTGRES_DB: g2_tmp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d g2_tmp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 臨時 CI 帳密，只存在於這台機器
      DATABASE_URL: postgresql://ci:ci@localhost:5432/g2_tmp
      SQL_ECHO: "false"
      # 假金鑰：openrouter_llm.py 在 import 時建立 client，缺金鑰會報錯
      OPENROUTER_API_KEY: ci-dummy-not-a-real-key
      # quota_harness 直接呼叫 gemini_chat_stream，缺金鑰會在函式開頭報錯
      GOOGLE_API_KEY: ci-dummy-not-a-real-key
      GOOGLE_CLIENT_ID: ci-dummy-google-client-id
      GOOGLE_CLIENT_SECRET: ci-dummy-google-client-secret
      GITHUB_CLIENT_ID: ci-dummy-github-client-id
      GITHUB_CLIENT_SECRET: ci-dummy-github-client-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run migrations from empty database
        run: uv run alembic upgrade head
      - name: Run harnesses
        run: ./dev/run_harnesses.sh

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # e2e 用假 API（e2e/mockApi.js），不需資料庫或金鑰
      - name: Run e2e tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
